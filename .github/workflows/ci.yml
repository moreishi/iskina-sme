name: CI

on:
  push:
    branches: [main, develop, "feature/**"]
  pull_request:

jobs:
  quality:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: iskina
          POSTGRES_PASSWORD: iskina
          POSTGRES_DB: iskina_sme
        ports:
          - 5437:5432
        options: >-
          --health-cmd "pg_isready -U iskina -d iskina_sme"
          --health-interval 3s
          --health-timeout 3s
          --health-retries 20
    env:
      DATABASE_URL: postgres://iskina:iskina@localhost:5437/iskina_sme
      DATABASE_ADMIN_URL: postgres://iskina:iskina@localhost:5437/iskina_sme
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 12.14.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm db:migrate
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build the Coolify web image
        uses: docker/build-push-action@v6
        with:
          context: .
          target: web
          push: false
          tags: iskina-sme:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
